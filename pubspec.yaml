name: komovia_shogi
description: >
  Shogi rules, AI, puzzles, kifu, and board rendering for Komovia, implementing
  komovia_core's Game/Engine/BoardRenderer interfaces. Ported from 効棋
  (zka32101/kouki-shogi).
publish_to: "none"

version: 0.1.0

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  komovia_core:
    git:
      url: https://github.com/zka32101/komovia_core
      ref: main
  flutter_riverpod: ^2.4.0
  riverpod: ^2.4.0
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^2.5.2
